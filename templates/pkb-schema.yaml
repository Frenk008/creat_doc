# ============================================================
# Project Knowledge Base (PKB) Schema
# 技术栈无关的统一知识模型 —— 所有 Skill 的唯一事实来源 (SSOT)
# ============================================================
#
# PKB 目录结构(按模块分文件,支持增量更新):
#
# knowledge/
# ├── project.yaml              # 项目基本信息(单文件)
# ├── modules/
# │   ├── user.yaml             # 用户管理模块
# │   ├── order.yaml            # 订单管理模块
# │   └── ...                   # 每个模块一个文件
# ├── pages/
# │   ├── login.yaml            # 登录页(独立,不属于特定模块)
# │   ├── user-list.yaml        # 用户列表页
# │   ├── user-edit.yaml        # 用户编辑页
# │   └── ...                   # 每个页面一个文件
# ├── roles/
# │   ├── admin.yaml            # 管理员角色
# │   ├── user.yaml             # 普通用户角色
# │   └── ...                   # 每个角色一个文件
# ├── workflows/
# │   ├── create-user.yaml      # 创建用户流程
# │   ├── delete-user.yaml      # 删除用户流程
# │   └── ...                   # 每个流程一个文件
# ├── workflow-chains.yaml      # 业务流程链(全局,单文件)
# ├── database/
# │   ├── _meta.yaml            # 数据库元信息(engine/version/charset)
# │   ├── sys_user.yaml         # 用户表
# │   ├── sys_role.yaml         # 角色表
# │   └── ...                   # 每张表一个文件
# ├── apis/
# │   ├── _meta.yaml            # API 元信息(base_url/auth_type/groups)
# │   ├── user-api.yaml         # 用户管理接口组
# │   ├── order-api.yaml        # 订单管理接口组
# │   └── ...                   # 每个接口分组一个文件
# ├── runtime/
#   ├── _meta.yaml              # 运行时探索元信息(status/explored_pages)
#   ├── dialogs.yaml            # 发现的弹窗
#   └── validation.yaml         # 校验规则
# ├── screenshots.yaml          # 截图计划(单文件)
# └── screenshot-config.yaml    # 截图配置(用户填写)
#
# ID 命名规范(路径遍历防护):
# - modules/pages/roles/workflows 的 id 字段:仅允许 [a-z0-9-],必须以字母或数字开头,长度 1-64
# - database 的表名:允许 [a-z0-9_-](兼容下划线命名如 sys_user)
# - 校验正则(通用):^[a-z0-9][a-z0-9-]{0,63}$
# - 校验正则(表名):^[a-z0-9_][a-z0-9_-]{0,63}$
# - 非法 ID 将被跳过并记录 warning,不会用作文件名
#
# 读取规则:
# - 需要全部模块时:读取 knowledge/modules/ 目录下所有 *.yaml
# - 需要特定模块时:只读取 knowledge/modules/{module_id}.yaml
# - 增量更新时:只重写变更的文件,不影响其他文件
# - 兼容模式:如果 knowledge/modules/ 目录不存在但 modules.yaml 存在,
#   按旧格式读取单文件(向后兼容)
#

# PKB Schema 版本(所有读取 PKB 的 Skill 应检查此版本)
# 当前支持版本: ["1.0"]
# 升级 PKB 结构时递增次版本号,不兼容变更递增主版本号
schema_version: "1.0"

# ---- project.yaml: 项目基本信息 ----
project:
  name: ""                    # 项目名称
  source_type: "code"         # code / website；可选字段，缺省按 code 处理
  version: ""                 # 版本号(如可识别)
  description: ""             # 项目简介
  tech_stack:
    backend: ""               # java / go / node / python / ...
    backend_framework: ""     # spring-boot / gin / echo / ...
    frontend: ""              # vue / react / angular / html / ...
    frontend_router: ""       # vue-router / react-router / ...
    ui_lib: ""                # element-plus / ant-design / ...
    build_tool: ""            # maven / gradle / go-mod / vite / webpack / ...
    database: ""              # mysql / postgresql / mongodb / ...
  target_users: []            # 目标用户群体(从代码/配置推断)

# ---- modules.yaml: 功能模块 ----
modules:
  - id: ""                    # 唯一标识(英文,如 user-management)
    name: ""                  # 中文名(如"用户管理")
    description: ""           # 模块简介(面向用户语言)
    pages: []                 # 关联页面 ID 列表
    workflows: []             # 关联业务流程 ID 列表
    roles: []                 # 可访问的角色 ID 列表

# ---- pages.yaml: 页面/界面 ----
pages:
  - id: ""                    # 唯一标识(如 user-list)
    app: "default"            # 所属前端应用标识(如 admin / client / portal),多套前端时区分
    route: ""                 # 默认路由路径(如 /users)
    routes:                   # 多主题/多前端的路由映射(同一页面的不同路由)
      # default: "/console/topup"    # default 主题的路由
      # classic: "/wallet"           # classic 主题的路由
      # 如所有主题路由一致则留空,只用 route 字段
    title: ""                 # 页面标题(中文)
    menu_path: ""             # 菜单层级(如"系统管理 > 用户管理")
    module_id: ""             # 所属模块 ID
    roles: []                 # 可访问角色
    actions: []               # 页面操作列表(如 create, edit, delete, export, search)
    fields: []                # 关键业务字段(如 username, email, role)
    description: ""           # 页面功能描述(面向用户语言)

# ---- roles.yaml: 用户角色 ----
roles:
  - id: ""                    # 唯一标识(如 admin)
    name: ""                  # 中文名(如"管理员")
    description: ""           # 角色说明
    permissions:              # 权限范围
      can_access: []          # 可访问模块/页面
      cannot_access: []       # 不可访问模块/页面
    typical_scenarios: []     # 典型使用场景

# ---- workflows.yaml: 业务流程 ----
workflows:
  - id: ""                    # 唯一标识(如 create-user)
    name: ""                  # 中文名(如"创建用户")
    module_id: ""             # 所属模块
    roles: []                 # 可执行角色
    steps:                    # 操作步骤
      - order: 1
        page_id: ""           # 在哪个页面
        action: ""            # 做什么操作(如"点击'新增'按钮")
        selector: ""          # 可稳定定位目标时记录 selector；优先 data-testid/data-action
        value: ""             # fill/select/press/upload 动作所需值
        ui_effect: ""         # page/dialog/drawer/dropdown/form_filled/confirm/success/error/none
        capture: "auto"       # auto/always/never；auto 按 ui_effect 和动作判断
        result: ""            # 操作结果(如"弹出创建对话框")
        notes: ""             # 注意事项
    preconditions: []         # 使用前提条件
    postconditions: []        # 完成后的结果

# ---- workflows.yaml 补充: 业务流程链 ----
# 例如: 登录 → 创建 → 查询 → 编辑 → 保存 → 导出 → 退出
workflow_chains:
  - id: ""
    name: ""
    description: ""
    workflow_ids: []          # 按顺序引用 workflow ID

# ---- database.yaml: 数据模型(支持数据库说明书) ----
database:
  engine: ""                    # mysql / postgresql / mongodb / ...
  version: ""                   # 数据库版本
  charset: ""                   # 字符集(如 utf8mb4)
  tables:
    - name: ""                  # 表名(如 sys_user)
      business_name: ""         # 中文名(如 用户表)
      description: ""           # 表用途说明
      module_id: ""             # 所属业务模块
      engine: ""                # InnoDB / MyISAM(留空则用默认)
      charset: ""               # 表字符集
      fields:
        - name: ""              # 字段名
          business_name: ""     # 中文名
          type: ""              # 数据类型(如 VARCHAR(50))
          nullable: false       # 是否允许为空
          default: ""           # 默认值
          primary_key: false    # 是否主键
          auto_increment: false # 是否自增
          unique: false         # 是否唯一约束
          index: false          # 是否普通索引
          index_name: ""        # 索引名(如有)
          foreign_key: ""       # 外键引用(如 sys_role.id)
          enum_values: []       # 枚举值(如启用状态 [0,1] 对应 [禁用,启用])
          description: ""       # 字段说明
      indexes:                  # 表索引
        - name: ""              # 索引名
          fields: []            # 索引字段
          type: ""              # unique / normal / fulltext
          description: ""
      relations:                # 表间关系
        - target_table: ""      # 关联目标表
          type: ""              # 1:1 / 1:N / N:M
          via_field: ""         # 通过哪个字段关联
          description: ""
  er_relations:                 # 全局 ER 关系汇总(用于绘制ER图)
    - from_table: ""
      to_table: ""
      type: ""                  # 1:1 / 1:N / N:M
      description: ""

# ---- apis.yaml: 接口定义(支持API文档) ----
apis:
  base_url: ""                  # API 基础路径(如 /api/v1)
  auth_type: ""                 # 认证方式(bearer / basic / apikey / none)
  groups:                       # 接口分组(按模块)
    - id: ""                    # 分组ID(对应 module_id)
      name: ""                  # 中文名(如"用户管理")
      description: ""
  endpoints:
    - id: ""                    # 唯一标识
      group_id: ""              # 所属分组
      method: ""                # GET / POST / PUT / DELETE / PATCH
      path: ""                  # 完整路径(如 /api/v1/users)
      summary: ""               # 接口摘要(中文)
      description: ""           # 详细说明
      tags: []                  # 标签
      deprecated: false         # 是否废弃
      auth_required: true       # 是否需要认证
      roles: []                 # 允许访问的角色
      request:
        headers:                # 请求头
          - name: ""
            type: ""
            required: true
            description: ""
        params:                 # 路径/查询参数
          - name: ""
            in: ""              # path / query
            type: ""
            required: true
            description: ""
            example: ""
        body:                   # 请求体
          content_type: ""      # application/json / multipart/form-data
          fields:
            - name: ""
              type: ""
              required: true
              description: ""
              example: ""
              enum_values: []   # 枚举可选值
      response:
        success:
          code: 200
          description: ""
          body:                 # 响应体字段
            - name: ""
              type: ""
              description: ""
              example: ""
        errors:                 # 错误响应
          - code: 400
            description: ""
            message: ""

# ---- screenshots.yaml: 截图计划(由 screenshot-planner 生成) ----
# 注意:只有 action / need_scroll / highlight / full_page / wait_after_action
# 会被截图脚本 generate_screenshots.py 实际消费;
# route / menu_path / prerequisite_shots / need_dialog / need_expand /
# need_confirm / need_error_state / data_state 为规划信息,供人工补拍与后续扩展。
screenshots:
  - id: ""                    # 如 shot-5-2
    manual_ref: ""            # 对应手册位置(如"5.2 创建用户-步骤3")
    placeholder: ""           # 手册占位符中的精确键(如"创建用户-步骤3")，供渲染器映射
    state_name: ""            # 目标界面状态名，如“联系详情弹窗”
    state_type: "page"        # page/dialog/drawer/dropdown/form_filled/confirm/success/error
    replay_from: "route"      # 固定为 route；每张图从路由初始状态独立重放
    page_id: ""               # 需要截图的页面
    app: ""                   # 所属前端应用(从 pages.app 复制,决定用哪个 base_url)
    route: ""                 # 页面路由(供 webapp-testing 导航)
    routes: {}                # 多主题路由映射(如 {admin: "/admin/users", user: "/users"},从 pages.routes 复制)
    menu_path: ""             # 菜单路径(参考)
    action: ""                # 字符串兼容模式，或结构化动作列表 [{type, selector, value?, wait_after?}]
    selector_status: "resolved" # resolved/unresolved；unresolved 必须进入审核警告
    need_scroll: false        # 是否需要滚动(脚本消费)
    highlight: ""             # 需要自动标注的元素，使用 、/，/, 分隔；脚本按顺序编号
    full_page: false          # 是否整页截图(脚本消费)
    wait_after_action: 500    # 操作后等待毫秒(脚本消费)
    data_state: ""            # 需要的数据状态(规划信息,脚本不自动构造)
    capture_reason: ""        # 为什么该 UI 状态需要单独截图
    prerequisite_shots: []    # 仅用于排序/说明；脚本不会继承前一截图的页面状态
    need_dialog: false        # 需触发弹窗(规划信息,用 action 描述触发)
    need_expand: false        # 需展开下拉(规划信息,用 action 描述触发)
    need_confirm: false       # 需触发确认提示(规划信息)
    need_error_state: false   # 需制造错误输入(规划信息)
    roles: []                 # 适用角色(多角色截图过滤)
    annotation:               # 采集后由脚本写入的自动标注统计
      requested: 0
      matched: 0
      missing: []
    annotation_warnings: []   # 未命中或绘制失败警告；不改变 captured 状态
    action_warnings: []       # 动作未识别/元素未命中；有内容时截图状态为 partial
    status: "planned"         # planned / captured / partial / failed / reviewed / need_retake

# ---- runtime.yaml: 运行时探索发现(由 runtime-explorer 在 --deep 模式写入) ----
# 字段名与 runtime-explorer 实际产出的 runtime.yaml 结构一致。
runtime:
  status: "not_explored"        # not_explored / partial / complete / timeout / auth_failed / failed
  mode: "enrich"                # bootstrap / enrich
  explored_at: ""               # 探索时间
  account_roles: []              # 实际尝试探索的测试账号角色
  uncovered_roles: []            # CAPTCHA/MFA/认证失败等未覆盖角色
  explored_pages: []            # 实际探索的页面ID
  skipped_pages: []             # 页面上限、超时或安全边界导致的跳过项
  failures: []                  # 不含密码/Cookie/Token的失败摘要
  total_pages: 0                # pages.yaml 中的页面总数
  explored_count: 0             # 实际探索的页面数
  discovered_dialogs:           # 运行时发现的对话框/弹窗
    - trigger_page: ""          # 触发页面ID
      trigger_action: ""        # 触发动作(如 click_create_button)
      dialog_type: ""           # modal / drawer / page
      dialog_title: ""
      fields: []                # 弹窗中的表单字段
      submit_button: ""
      cancel_button: ""
  discovered_validation_rules:  # 表单校验规则
    - page: ""
      field: ""
      rules:                    # 规则列表
        - type: ""              # required / length / email / ...
          message: ""
  discovered_dynamic_elements:  # 动态加载元素
    - page: ""
      element: ""
      trigger: ""
      dependency: ""
  discovered_feedback_messages: # 操作反馈提示
    - trigger: ""
      message: ""
      type: ""                  # success / error / warning / info

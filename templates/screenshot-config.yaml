# 截图配置模板
# 用户需先自行启动项目(如 docker compose up / npm run dev / java -jar 等),
# 然后填写此文件,放到 knowledge/screenshot-config.yaml

screenshot:
  # 浏览器视口大小
  viewport:
    width: 1920
    height: 1080
  # 截图模式: viewport(仅可视区域) / full_page(整页)
  default_mode: "viewport"    # 当前不支持:脚本通过每张截图的 full_page 字段控制
  # 页面加载超时(毫秒)
  page_timeout: 15000         # 当前不支持:脚本使用硬编码 timeout
  # 操作后等待时间(毫秒,等动画完成)
  action_delay: 500           # 当前不支持:脚本通过每张截图的 wait_after_action 控制

# 单前端项目:用 base_url
base_url: "http://localhost:8080"

# 多前端项目:用 apps 字典为每套前端指定独立的 base_url
# pages.yaml 中的 app 字段决定每个页面用哪个 URL
# 如果 apps 存在,优先使用 apps;否则用上面的 base_url
apps:
  admin:                      # 管理端
    base_url: "http://localhost:8080"
  client:                     # 用户端/C端
    base_url: "http://localhost:3000"
  # portal:                  # 门户端(如有)
  #   base_url: "http://localhost:8081"

# 测试账号(按角色配置)
# 如果不同前端有不同账号体系,在对应角色下标注 app
test_accounts:
  admin:
    username: "admin"
    password: "admin123"
    login_url: "/login"
    expected_redirect: "/dashboard"  # 当前不支持:脚本用 URL 是否含 "login" 判断登录状态
    app: "admin"              # 该账号登录哪套前端(单前端项目可省略)
  
  user:
    username: "testuser"
    password: "test123"
    login_url: "/login"
    expected_redirect: "/home"       # 当前不支持:脚本用 URL 是否含 "login" 判断登录状态
    app: "client"             # 该账号登录哪套前端

  # 如有更多角色,按同样格式添加
  # reviewer:
  #   username: "reviewer"
  #   password: "review123"
  #   login_url: "/login"
  #   expected_redirect: "/review"
  #   app: "admin"
